name: Bug Report
description: Report a bug to help us improve
labels: [bug]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behaviour.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      description: What did you expect to happen?

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      description: What actually happened?

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, PHP version, browser, relevant .env config
      placeholder: macOS 14, PHP 8.5, Chrome 126

  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Paste any relevant log output (e.g. from laravel.log, browser console).
      render: shell
